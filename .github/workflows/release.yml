name: Release SparkPOS

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: sparkpos-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}

      - name: Install Frontend Dependencies
        working-directory: sparkpos-app
        run: npm ci

      - name: Build Tauri App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: sparkpos-app
          tagName: v__VERSION__
          releaseName: 'SparkPOS Desktop v__VERSION__'
          releaseBody: |
            ### SparkPOS Desktop v__VERSION__

            - **Perbaikan Akurasi Laporan Keuangan & Saldo Kas (Zero Selisih)**: Memperbaiki logika penerimaan kas masuk (`cashSalesTotal`) dan ekspektasi kas laci kasir (`expectedCash`). Uang kembalian yang telah diserahkan kembali ke pelanggan tidak lagi mengurangi nilai belanja transaksi secara ganda. Total Kas Tunai + Bank kini seimbang sempurna (100% klop) dengan Total Omset Toko.
            - **Sinkronisasi Otomatis Sesi Kasir (Self-Healing)**: Sesi kasir yang aktif otomatis menyelaraskan nilai kas seharusnya berdasarkan riwayat transaksi fisik nyata, menormalkan status selisih kas menjadi seimbang.
            - **Garansi Toko Khusus Laptop, Sparepart & Printer**: Kartu garansi pada struk kasir (58mm) maupun faktur (A4) eksklusif untuk Laptop, Sparepart, dan Printer. Aksesoris dan Jasa bebas kartu garansi.
            - **Validasi Formulir Terima Servis**: Nama, Nomor WhatsApp, dan Tipe Perangkat wajib diisi, sementara keluhan kini opsional dengan fallback otomatis.
            - **Integrasi Notifikasi WhatsApp Servis (Smart Detect)**: Notifikasi WhatsApp instan dengan deteksi WA Web / Desktop app dan 5 template pesan sopan.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
