name: Release SparkPOS

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: sparkpos-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}

      - name: Install Frontend Dependencies
        working-directory: sparkpos-app
        run: npm ci

      - name: Build Tauri App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: sparkpos-app
          tagName: v__VERSION__
          releaseName: 'SparkPOS Desktop v__VERSION__'
          releaseBody: |
            ### SparkPOS Desktop v__VERSION__

            - **Garansi & Manajemen Stok Fleksibel**: Masa garansi produk di menu Stok kini dapat diatur secara fleksibel (pilihan hari/bulan atau input manual bebas), dengan default baru `Non-Garansi` (tidak lagi hardcoded 1 bulan). Produk non-garansi otomatis tidak memunculkan baris garansi pada nota.
            - **Kartu Garansi Khusus Unit Laptop & Layout Struk Rapi**: Kartu garansi pada struk kasir kini khusus untuk pembelian unit laptop. Teks nota panjang otomatis membungkus (text wrap) rapi sesuai lebar thermal 32 karakter dan tidak terpotong ke samping. Format cetak A4/thermal dioptimalkan menghemat kertas.
            - **Kategori Baru Printer & Tinta**: Kategori master `Printer & Tinta` untuk printer, tinta botol, cartridge, toner, dan kertas dengan auto-migrasi database.
            - **Pembatalan Servis dengan Alasan & Bukti Nota**: Pembatalan tiket servis kini mencatat alasan detail (mis. dibatalkan pelanggan, sparepart kosong, rusak parah) dan dilengkapi cetak *Nota Pembatalan Servis*.
            - **Laporan Keuangan Sederhana & Bersih**: Menghilangkan singkatan JT/Rb agar laporan bersih dan angka Rupiah jelas. Ekspor kas harian disederhanakan tanpa duplikasi baris. Ekspor Excel otomatis menggabungkan banner judul toko dan menyesuaikan lebar kolom. Riwayat transaksi menampilkan rincian pembayaran tunai, kembalian, dan kas bersih masuk secara transparan.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
