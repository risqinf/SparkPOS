name: Release SparkPOS

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: sparkpos-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}

      - name: Install Frontend Dependencies
        working-directory: sparkpos-app
        run: npm ci

      - name: Build Tauri App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: sparkpos-app
          tagName: v__VERSION__
          releaseName: 'SparkPOS Desktop v__VERSION__'
          releaseBody: |
            ### SparkPOS Desktop v__VERSION__

            - **Cetak otomatis tanpa dialog**: pilih printer thermal 58mm & A4 di Pengaturan > Printer Kasir (terdeteksi otomatis). Struk 58mm dikirim langsung via ESC/POS dan laci uang terbuka untuk pembayaran tunai; faktur A4 dicetak senyap. Tersedia tombol uji cetak.
            - **Keyboard standar**: Tab normal, Esc & focus trap di semua modal, F2/Ctrl+K cari, F12/Ctrl+Enter bayar, navigasi baris keranjang, F1 bantuan, Ctrl+1..5 pindah menu. F5/Ctrl+R/Ctrl+P diblokir.
            - **Laporan format buku toko**: Kas Harian, Keuntungan, dan Pembelian (sheet per bulan, rumus Excel hidup).
            - **Uang kas masuk/keluar** tampil di Riwayat Transaksi (bisa dikoreksi/dihapus), dengan kategori & contoh keterangan baru.
            - **Tema terang/gelap** konsisten di semua modal dan halaman.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
