name: Release SparkPOS

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: sparkpos-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}

      - name: Install Frontend Dependencies
        working-directory: sparkpos-app
        run: npm ci

      - name: Build Tauri App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: sparkpos-app
          tagName: v__VERSION__
          releaseName: 'SparkPOS Desktop v__VERSION__'
          releaseBody: |
            ### SparkPOS Desktop v__VERSION__

            - **Kartu Garansi Toko Khusus Laptop, Sparepart & Printer**: Kartu garansi toko pada struk thermal kasir (58mm) maupun faktur resmi (A4) secara konsisten dan eksklusif hanya diberikan untuk barang kategori atau produk Laptop, Sparepart, dan Printer/Print. Produk Aksesoris dan Jasa tidak memicu kartu garansi toko.
            - **Validasi Wajib Formulir Terima Servis**: Kolom wajib diisi pada formulir terima servis diperbarui menjadi Nama Pelanggan, Nomor WhatsApp / HP, dan Tipe Perangkat. Kolom keluhan kini opsional dengan fallback otomatis.
            - **Integrasi Notifikasi WhatsApp Servis (Smart Detect)**: Mengabari pelanggan langsung ke WhatsApp dari dashboard servis, nota cetak, maupun saat simpan tiket dengan 5 template pesan ramah dan sopan.
            - **Garansi & Manajemen Stok Fleksibel**: Masa garansi produk dapat diatur hari/bulan atau kustom dengan default Non-Garansi.
            - **Kategori Baru Printer & Tinta**: Kategori master Printer & Tinta dengan auto-migrasi database.
            - **Laporan Keuangan Sederhana & Bersih**: Angka Rupiah transparan tanpa singkatan, ekspor kas harian rapi, dan judul toko Excel auto-fit tanpa terpotong.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
