name: Release SparkPOS

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: sparkpos-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}

      - name: Install Frontend Dependencies
        working-directory: sparkpos-app
        run: npm ci

      - name: Build Tauri App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: sparkpos-app
          tagName: v__VERSION__
          releaseName: 'SparkPOS Desktop v__VERSION__'
          releaseBody: |
            ### 🚀 SparkPOS v2.0 — Major Desktop Release

            Rilis pembaruan besar untuk operasional retail toko komputer & jasa servis laptop:

            - 🔧 **Modul Service Komputer & Laptop**: Pencatatan unit masuk, diagnosa kerusakan, alokasi sparepart & biaya jasa, status pengerjaan (Diterima, Dikerjakan, Selesai, Diambil), serta cetak nota tanda terima termal 58mm/80mm.
            - 💾 **Relokasi Lokasi Database Dinamis**: Database tidak lagi terkunci di folder default apps. Bebas dipindahkan ke Harddisk (HDD) eksternal atau Drive D: dengan penyalinan data otomatis tanpa resiko data hilang (*zero data loss*).
            - 👥 **Sistem 3 Role**: Owner, Teknisi, dan Kasir dengan filter akses menu yang disesuaikan untuk kenyamanan kerja tim toko.
            - 🚚 **Manajemen Supplier**: Pencatatan distributor dan pemasok komponen/hardware (HDD, SSD, RAM, sparepart).
            - 👤 **Nama Pelanggan di Struk**: Input nama pelanggan langsung di kasir & tercetak otomatis pada struk belanja maupun nota servis.
            - 📊 **Export Excel Offline**: Ekspor Laporan Penjualan Kasir, Valuasi Aset Stok HPP, dan Rekapitulasi Jasa Servis ke format spreadsheet Excel (*UTF-8 BOM*).
            - 🖥️ **UI Layout Ultra Fleksibel**: Mendukung resolusi layar beragam dari monitor desktop modern hingga laptop klasik (ThinkPad X201, resolusi 1280x800).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
