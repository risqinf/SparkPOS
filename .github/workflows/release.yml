name: Release SparkPOS

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: sparkpos-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}

      - name: Install Frontend Dependencies
        working-directory: sparkpos-app
        run: npm ci

      - name: Build Tauri App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: sparkpos-app
          tagName: v__VERSION__
          releaseName: 'SparkPOS Desktop v__VERSION__'
          releaseBody: |
            ### 🚀 SparkPOS Desktop v__VERSION__ — High Performance & Unified Retail Release

            Pembaruan komprehensif untuk stabilitas, kecepatan, efisiensi memori, dan penyederhanaan operasional toko:

            - 🔐 **UI Login Sederhana & Keyboard-Only**: Form minimalis di tengah layar, fokus langsung pada pengetikan keyboard (Username & PIN), shortcut Enter, tanpa on-screen keypad yang memenuhi layar.
            - 💳 **Metode Pembayaran Kasir 2 Pilihan**: Hanya Tunai (Cash) dengan perhitungan kembalian instan dan Transfer Bank uang pas dengan catatan bank/referensi.
            - 🛠️ **Perbaikan Riwayat Transaksi Terpadu**: Mengatasi selisih tanggal timezone lokal WIB vs UTC, serta menyatukan transaksi belanja POS dan order servis yang dibayar ke dalam riwayat harian.
            - 📊 **Laporan Keuangan Terpadu & Lengkap**: 1 dashboard finansial lengkap menggantikan tab-tab lama, menyajikan Modal Awal Kasir, Total Omset Toko (POS + Servis), Total Modal HPP, Pengeluaran Toko, Laba Bersih, Saldo Kas di Laci Kasir, serta rincian item per transaksi.
            - 💵 **Modal Awal Kasir Wajib Awal Hari**: Dialog wajib input uang kas laci saat login pertama kali setiap hari kerja (07.00 - 16.30).
            - 🧹 **Pembersihan Fitur**: Menghapus form Cabang, menyederhanakan multi-shift menjadi Laporan Kas Hari Ini (07.00 - 16.30), dan menghapus kurir/ongkir dari terminal kasir untuk transaksi langsung di tempat yang lebih cepat.
            - 📑 **List Katalog Kasir Mode Detail**: Mengubah katalog produk dari kartu kotak menjadi tabel detail row (Barcode, Nama Lengkap tanpa terpotong, Kategori, Badge Stok Jelas, Harga Jual, dan Tombol Cepat +Keranjang).
            - 🎨 **Peningkatan Kontras & Tema Terang/Gelap**: Warna teks tajam dan kontras pekat (High-Contrast), border tegas, serta bebas dari teks abu-abu pudar di mode terang.
            - 📥 **Ekspor Excel Terpadu (.csv UTF-8 BOM)**: Ekspor laporan keuangan lengkap beserta rincian item yang langsung rapi di Microsoft Excel & LibreOffice.
            - ⚡ **Optimasi Performa & Minim RAM**: Bundle diperkecil, query database IndexedDB efisien, dan siap digunakan cepat & stabil.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
