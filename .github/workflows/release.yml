name: Release SparkPOS

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: sparkpos-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}

      - name: Install Frontend Dependencies
        working-directory: sparkpos-app
        run: npm ci

      - name: Build Tauri App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: sparkpos-app
          tagName: v__VERSION__
          releaseName: 'SparkPOS Desktop v__VERSION__'
          releaseBody: |
            ### SparkPOS Desktop v__VERSION__

            - **Pengurutan Stok Produk Berdasarkan Abjad (A-Z)**: Seluruh katalog produk pada Manajemen Stok, Kasir POS, dan Stock Opname kini otomatis tersusun rapi secara alfabetis A-Z untuk mempermudah pencarian dan audit fisik.
            - **Sinkronisasi Status Servis & Laporan Keuangan (Status Pending)**: Servis yang baru masuk (DITERIMA, DIKERJAKAN, maupun SELESAI) dan belum lunas akan berstatus pending dan tidak masuk ke laporan keuangan sampai unit benar-benar diambil pelanggan.
            - **Otomatis Masuk Laporan Keuangan Saat Diambil (Sesuai Hari Pengambilan)**: Ketika status servis diubah menjadi DIAMBIL, pendapatan servis otomatis masuk ke laporan keuangan dengan tanggal sesuai hari pengambilan unit (bukan tanggal selesai pengerjaan teknisi di hari kemarin).
            - **Pengakuan Lunas di Awal (Instant Recognition)**: Jika opsi "Tagihan Servis Sudah Lunas Dibayar" dicentang sejak awal penerimaan/pengerjaan, omset servis langsung masuk ke laporan keuangan hari itu juga. Ketika status berubah menjadi DIAMBIL di kemudian hari, tanggal laporan tidak akan berubah karena sudah tercatat saat pelunasan.
            - **Koreksi Hari / Tanggal Transaksi pada Laporan Keuangan**: Modal Koreksi Transaksi kini dilengkapi fitur pengubahan hari/tanggal transaksi (POS maupun Servis) sehingga pengguna dapat menyesuaikan tanggal jika pembayaran baru dilakukan hari ini atau terdapat kekeliruan tanggal.
            - **Optimasi Performa Ringan untuk Laptop Lama (RAM Kecil & HDD)**: Mengurangi beban I/O pembacaan disk IndexedDB berkala dari 5 detik menjadi 30 detik (visibility-aware event-driven), menjaga aplikasi tetap responsif, bebas lag, dan hemat memori RAM di perangkat PC/laptop jadul ber-HDD.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
