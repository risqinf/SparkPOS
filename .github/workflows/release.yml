name: Release SparkPOS

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: sparkpos-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}

      - name: Install Frontend Dependencies
        working-directory: sparkpos-app
        run: npm ci

      - name: Build Tauri App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: sparkpos-app
          tagName: v__VERSION__
          releaseName: 'SparkPOS Desktop v__VERSION__'
          releaseBody: |
            ### SparkPOS Desktop v__VERSION__

            - **Integrasi Notifikasi WhatsApp Servis (Smart Detect)**: Mengabari pelanggan langsung ke WhatsApp dari dashboard servis, nota cetak, maupun saat simpan tiket. Otomatis mendeteksi WhatsApp Web atau aplikasi WhatsApp Desktop Windows.
            - **Template Pesan Sopan & Profesional**: 5 template pesan ramah berbahasa Indonesia (Tanda Terima Masuk, Estimasi Biaya & Persetujuan, Servis Selesai Siap Diambil, Pembatalan Servis, dan Konfirmasi Pengambilan / Garansi). Dilengkapi No. Tiket/Nota, keluhan, estimasi pengerjaan, rincian biaya, DP, sisa pembayaran, dan kontak toko.
            - **Pratinjau & Edit Pesan**: Tinjau dan sesuaikan isi pesan sebelum dikirim, serta bersihkan format nomor telepon otomatis (+62).
            - **Garansi & Manajemen Stok Fleksibel**: Masa garansi produk dapat diatur hari/bulan atau kustom dengan default `Non-Garansi`.
            - **Kartu Garansi Khusus Unit Laptop & Layout Struk Rapi**: Kartu garansi pada nota khusus laptop, teks panjang membungkus rapi 32 kolom thermal, dan layout hemat kertas.
            - **Kategori Baru Printer & Tinta**: Kategori master Printer & Tinta dengan auto-migrasi database.
            - **Laporan Keuangan Sederhana & Bersih**: Angka Rupiah jelas tanpa singkatan JT/Rb, ekspor kas harian rapi, dan judul toko Excel auto-fit tanpa terpotong.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
