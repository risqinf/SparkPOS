name: CI

# Memeriksa setiap branch/PR: typecheck + build frontend, lalu cargo check di Windows
# (kode cetak langsung memakai API Windows sehingga harus dikompilasi di Windows).
on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: sparkpos-app/package-lock.json
      - name: Install
        working-directory: sparkpos-app
        run: npm ci
      - name: Typecheck
        working-directory: sparkpos-app
        run: npx tsc --noEmit
      - name: Build
        working-directory: sparkpos-app
        run: npm run build

  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: sparkpos-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Build frontend (dibutuhkan tauri::generate_context!)
        working-directory: sparkpos-app
        run: |
          npm ci
          npm run build
      - name: cargo check
        working-directory: sparkpos-app/src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = cargo check --locked --message-format=short 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out | Select-Object -Last 60 | ForEach-Object { Write-Host $_ }
          # tampilkan error rustc sebagai annotation agar terbaca di halaman run
          $out | Where-Object { $_ -match 'error' } | Select-Object -First 8 | ForEach-Object { Write-Host "::error::$_" }
          exit $code
